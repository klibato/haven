services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "cd apps/server && npx prisma db push && npx tsx prisma/seed.ts 2>/dev/null; npx tsx watch src/index.ts"
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=file:./data/haven.db
      - JWT_SECRET=dev-secret-change-in-production
      - NODE_ENV=development
      - PORT=3001
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - ./apps/server/src:/app/apps/server/src
      - ./apps/server/prisma:/app/apps/server/prisma
      - ./packages/shared/src:/app/packages/shared/src
      - server_data:/app/apps/server/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "cd apps/web && npx vite --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - API_URL=http://server:3001
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      server:
        condition: service_healthy

volumes:
  server_data:
